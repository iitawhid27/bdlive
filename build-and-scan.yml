name: Build APK and refresh playlist
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scan playlist sources
        run: python scripts/scan_playlist.py
      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || (git commit -m "Refresh playlist scan" && git push)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BD-World-Live-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
